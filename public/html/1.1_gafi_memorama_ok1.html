<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Memorama GAFI — Número y Nombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14112a;
    --bg2: #1b1638;
    --panel: #1f1a40;
    --line: #332a5e;
    --ink: #ece9fb;
    --ink-dim: #a79fd1;
    --gold: #e8b64a;
    --back1: #2a2255;
    --back2: #201a44;
    --A: #4fc3cc; --B: #e15a5a; --C: #f2a154; --D: #5f8ff0; --E: #b47ee0; --F: #52c785; --G: #e3c548;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background: var(--bg); color:var(--ink);
    font-family:"Inter",system-ui,sans-serif; }
  h1,h2,.num-display{ font-family:"Space Grotesk",sans-serif; }

  header{ text-align:center; padding: 30px 20px 10px 20px; }
  header h1{ font-size: 26px; margin:0 0 8px 0; font-weight:700; letter-spacing: 0.2px; }
  header p{ color: var(--ink-dim); font-size: 13.5px; max-width: 560px; margin: 0 auto; line-height:1.55; }

  /* ---------------- Setup screen ---------------- */
  #setup{ max-width: 720px; margin: 20px auto 60px auto; padding: 0 20px; }
  .setup-block{ margin-bottom: 26px; }
  .setup-label{ font-size: 12.5px; font-weight:700; color: var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
  .cat-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:10px; }
  .cat-btn{
    text-align:left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--D));
    color: var(--ink); padding: 12px 14px; border-radius: 8px; cursor:pointer; font-family:"Inter",sans-serif;
  }
  .cat-btn:hover{ background: var(--bg2); }
  .cat-btn.active{ outline: 2px solid var(--gold); }
  .cat-btn .name{ font-weight:600; font-size:13.5px; }
  .cat-btn .count{ font-size:11.5px; color: var(--ink-dim); margin-top:2px; }

  .size-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .size-btn{
    background: var(--panel); border:1px solid var(--line); color:var(--ink);
    padding: 9px 16px; border-radius: 999px; cursor:pointer; font-size:13.5px; font-family:"Inter",sans-serif;
  }
  .size-btn.active{ background: var(--gold); color:#1a1430; border-color:transparent; font-weight:700; }

  .start-btn{
    display:block; width:100%; margin-top: 10px; padding: 14px; border:none; border-radius: 10px;
    background: var(--gold); color:#1a1430; font-weight:700; font-size:15px; cursor:pointer;
    font-family:"Space Grotesk",sans-serif; letter-spacing:0.3px;
  }
  .start-btn:disabled{ opacity:0.4; cursor:default; }

  /* ---------------- Game screen ---------------- */
  #game{ display:none; max-width: 1500px; margin: 0 auto 60px auto; padding: 0 20px; }
  .game-bar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    margin-bottom: 18px;
  }
  .stat{ font-size:13px; color: var(--ink-dim); }
  .stat b{ color: var(--ink); font-family:"Space Grotesk",sans-serif; }
  .bar-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim); padding:7px 13px;
    border-radius:7px; cursor:pointer; font-size:12.5px; font-family:"Inter",sans-serif;
  }
  .bar-btn:hover{ color:var(--ink); border-color: var(--gold); }

  #foundRow{ margin-bottom: 16px; }
  .found-label{ font-size: 11.5px; color: var(--ink-dim); display:block; margin-bottom:7px; }
  #foundChips{ display:flex; flex-wrap:wrap; gap:7px; }
  .found-chip{
    font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:12.5px;
    padding: 4px 11px; border-radius: 999px; cursor:pointer;
    background: color-mix(in srgb, var(--c) 18%, transparent);
    border: 1px solid var(--c); color: var(--ink);
  }
  .found-chip:hover{ background: color-mix(in srgb, var(--c) 35%, transparent); }

  #board{
    display:grid; gap: 12px;
    grid-template-columns: repeat(var(--cols,4), 1fr);
  }
  .cell{ perspective: 800px; aspect-ratio: 3/4.3; }
  .card{
    position:relative; width:100%; height:100%; cursor:pointer;
    transform-style: preserve-3d; transition: transform 420ms cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }
  .card.matched{ cursor:default; }
  .card.matched .face{ opacity: 0.35; }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius: 10px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding: 10px;
  }
  .face-back{
    background:
      radial-gradient(circle at 30% 20%, var(--back1), var(--back2) 70%);
    border: 1px solid var(--line);
  }
  .face-back::after{
    content:"⚖"; font-size: 26px; color: rgba(232,182,74,0.55);
  }
  .face-front{
    transform: rotateY(180deg);
    border: 2px solid var(--c, var(--D));
    background: linear-gradient(160deg, var(--bg2), var(--bg));
    flex-direction: column; gap: 4px;
  }
  .face-front.type-num{ }
  .face-front .big-num{
    font-size: clamp(26px, 6vw, 40px); font-weight:700; color: var(--c, var(--D));
    line-height:1;
  }
  .face-front .sub{ font-size: 10px; color: var(--ink-dim); text-transform:uppercase; letter-spacing:0.4px; }
  .face-front.type-name .name-text{ font-size: 12px; line-height:1.28; color: var(--ink); font-weight:600; overflow-wrap: break-word; hyphens:auto; min-width: 0; width: 100%; }

  .card:not(.flipped):not(.matched):hover .face-back{ border-color: var(--gold); }

  /* ---------------- Match modal ---------------- */
  #overlay{
    display:none; position:fixed; inset:0; background: rgba(10,7,20,0.78);
    z-index: 20; align-items:center; justify-content:center; padding:20px;
  }
  #matchCard{
    background: var(--panel); border: 2px solid var(--c, var(--gold)); border-radius: 16px;
    max-width: 540px; width:100%; padding: 32px 32px 28px 32px; text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: pop 260ms cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{ from{ transform: scale(0.85); opacity:0; } to{ transform: scale(1); opacity:1; } }
  #matchCard .tag{ font-size:11.5px; color: var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  #matchCard .num-display{ font-size: 58px; font-weight:700; color: var(--c, var(--gold)); line-height:1; margin-bottom:6px; }
  #matchCard .name-display{ font-size: 20px; font-weight:700; margin: 0 0 16px 0; line-height:1.3; }
  #matchCard .desc{ font-size: 15px; color: var(--ink); line-height:1.6; margin-bottom: 22px; text-align:left; }
  #matchCard .continue-btn{
    background: var(--gold); color:#1a1430; border:none; padding: 11px 26px; border-radius:8px;
    font-weight:700; cursor:pointer; font-family:"Space Grotesk",sans-serif; font-size:14px;
  }

  /* ---------------- End screen ---------------- */
  #endScreen{ display:none; text-align:center; padding: 40px 20px; }
  #endScreen h2{ font-size:24px; margin-bottom:10px; }
  #endScreen p{ color:var(--ink-dim); font-size:14px; margin-bottom: 22px; }
  #endScreen .start-btn{ max-width: 280px; margin: 0 auto 12px auto; }

  @media (max-width: 640px){
    #board{ --cols: 3 !important; }
  }
</style>
</head>
<body>

<header>
  <h1>🃏 Memorama GAFI</h1>
  <p>Encuentra cada pareja número ↔ nombre. Al acertar, se abre la ficha completa de esa Recomendación para reforzarla.</p>
</header>

<div id="setup">
  <div class="setup-block">
    <div class="setup-label">Elige qué practicar</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <div class="setup-block" id="sizeBlock" style="display:none;">
    <div class="setup-label">¿Cuántas parejas?</div>
    <div class="size-row" id="sizeRow"></div>
  </div>

  <button class="start-btn" id="startBtn" disabled>Empezar</button>

  <div class="setup-block" style="margin-top:30px; border-top:1px solid var(--line); padding-top:24px;">
    <div class="setup-label">🔥 Máxima dificultad</div>
    <button class="cat-btn" id="hardModeBtn" style="width:100%; border-left-color:var(--gold);">
      <div class="name">Las 40 completas, todas revueltas</div>
      <div class="count">80 cartas en un solo tablero — sin dividir por categoría</div>
    </button>
  </div>
</div>

<div id="game">
  <div class="game-bar">
    <div class="stat">Parejas: <b id="statMatches">0</b> / <span id="statTotal">0</span></div>
    <div class="stat">Intentos: <b id="statMoves">0</b></div>
    <button class="bar-btn" id="restartBtn">↻ Reiniciar</button>
    <button class="bar-btn" id="changeBtn">← Regresar a Menú Principal</button>
  </div>
  <div id="foundRow" style="display:none;">
    <span class="found-label">Ya encontradas — haz clic para repasar:</span>
    <div id="foundChips"></div>
  </div>
  <div id="board"></div>
</div>

<div id="endScreen">
  <h2>🎉 ¡Completado!</h2>
  <p id="endStats"></p>
  <button class="start-btn" id="playAgainBtn" style="max-width:280px;margin:0 auto 12px auto;">Jugar de nuevo (mismo set)</button>
  <button class="bar-btn" id="endChangeBtn">Regresar a Menú Principal</button>
</div>

<div id="overlay">
  <div id="matchCard">
    <div class="tag">¡Pareja encontrada!</div>
    <div class="num-display" id="mNum"></div>
    <div class="name-display" id="mName"></div>
    <div class="desc" id="mDesc"></div>
    <button class="continue-btn" id="mContinue">Seguir jugando</button>
  </div>
</div>

<script>
/* ---------- Data: 40 Recomendaciones ---------- */
const REC = {
  1:{cat:"A", name:"Evaluación de riesgos y aplicación de un enfoque basado en riesgo", desc:"Los países deben identificar, entender y evaluar sus riesgos de LA/FT, y aplicar un enfoque basado en riesgo: medidas reforzadas si el riesgo es mayor, simplificadas si es menor."},
  2:{cat:"A", name:"Cooperación y coordinación nacional", desc:"Los países deben tener políticas ALA/CFT/CFP a nivel nacional, con una autoridad que coordine y mecanismos de cooperación entre todas las autoridades competentes."},
  3:{cat:"B", name:"Delito de lavado de activos", desc:"Tipificar el lavado de activos con base en las Convenciones de Viena y Palermo, aplicándolo a la más amplia gama posible de delitos determinantes."},
  4:{cat:"B", name:"Decomiso y medidas provisionales", desc:"Contar con políticas que prioricen la recuperación de activos, y medidas legislativas para congelar, incautar, decomisar y administrar bienes producto del delito."},
  5:{cat:"C", name:"Delito de financiamiento del terrorismo", desc:"Tipificar el financiamiento del terrorismo conforme al Convenio de 1999, incluso sin vincularlo a un acto terrorista específico, como delito determinante del LA."},
  6:{cat:"C", name:"Sanciones financieras dirigidas relacionadas con el terrorismo y el financiamiento del terrorismo", desc:"Implementar sin demora sanciones financieras dirigidas para cumplir las Resoluciones del Consejo de Seguridad de la ONU sobre terrorismo, congelando de inmediato los activos de personas y entidades designadas."},
  7:{cat:"C", name:"Sanciones financieras dirigidas relacionadas con la proliferación", desc:"Implementar sin demora sanciones financieras dirigidas conforme a las resoluciones del Consejo de Seguridad de la ONU sobre financiamiento de la proliferación de armas de destrucción masiva."},
  8:{cat:"C", name:"Organizaciones sin fines de lucro (OSFL)", desc:"Identificar a las organizaciones sin fines de lucro (OSFL) vulnerables al abuso por financiamiento del terrorismo, y aplicarles medidas focalizadas y basadas en riesgo."},
  9:{cat:"D", name:"Leyes sobre el secreto de las instituciones financieras", desc:"Las leyes sobre el secreto de las instituciones financieras (secreto bancario) no deben impedir la implementación de las Recomendaciones del GAFI."},
  10:{cat:"D", name:"Debida diligencia del cliente (DDC)", desc:"Prohibir cuentas anónimas y aplicar debida diligencia del cliente al iniciar relaciones comerciales, en transacciones ocasionales sobre el umbral de USD/EUR 15,000, o ante sospecha de LA/FT."},
  11:{cat:"D", name:"Mantenimiento de registros", desc:"Conservar los registros de transacciones y de debida diligencia del cliente por al menos 5 años, suficientes para reconstruir cada operación individual."},
  12:{cat:"D", name:"Personas expuestas políticamente (PEP)", desc:"Aplicar medidas reforzadas —aprobación de alta gerencia, origen de fondos, monitoreo intensificado— a las personas expuestas políticamente extranjeras siempre, y a las locales según el riesgo."},
  13:{cat:"D", name:"Banca corresponsal", desc:"Aplicar debida diligencia reforzada en relaciones de banca corresponsal transfronteriza, entendiendo el negocio del banco representado, y prohibir operar con bancos pantalla."},
  14:{cat:"D", name:"Servicios de transferencia de dinero o valores (STDV)", desc:"Los proveedores de Servicios de Transferencia de Dinero o Valores (STDV) y sus agentes deben tener licencia o estar registrados, y sujetos a monitoreo efectivo."},
  15:{cat:"D", name:"Nuevas tecnologías", desc:"Evaluar los riesgos de nuevos productos, prácticas comerciales y tecnologías —incluidos los activos virtuales— antes de su lanzamiento, y regular a los proveedores de servicios de activos virtuales."},
  16:{cat:"D", name:"Transparencia de pagos", desc:"Incluir información completa del ordenante y beneficiario en toda transferencia; los países pueden fijar un umbral mínimo opcional de hasta USD/EUR 1,000."},
  17:{cat:"D", name:"Dependencia en terceros", desc:"Permite a una institución financiera delegar ciertos elementos de la debida diligencia del cliente en un tercero, sin transferir la responsabilidad final."},
  18:{cat:"D", name:"Controles internos y sucursales y filiales extranjeras", desc:"Exigir programas contra el LA/FT a nivel de todo el grupo financiero, con intercambio de información entre sucursales y filiales, incluidas las del extranjero."},
  19:{cat:"D", name:"Países de mayor riesgo", desc:"Aplicar debida diligencia intensificada a relaciones y transacciones con países de mayor riesgo, y contramedidas apropiadas cuando el GAFI lo solicite."},
  20:{cat:"D", name:"Reporte de operaciones sospechosas (ROS)", desc:"Reportar con prontitud a la UIF cuando se sospeche que los fondos provienen de actividad criminal o están vinculados al financiamiento del terrorismo, sin importar el monto."},
  21:{cat:"D", name:"Revelación (tipping-off) y confidencialidad", desc:"Proteger legalmente a quien reporta de buena fe frente a responsabilidad penal y civil, y prohibir revelar que se presentó un Reporte de Operación Sospechosa."},
  22:{cat:"D", name:"APNFD (Actividades y Profesiones No Financieras Designadas): Debida diligencia del cliente", desc:"Aplicar debida diligencia del cliente y mantenimiento de registros a casinos, agentes inmobiliarios, comerciantes de metales preciosos, abogados, notarios y proveedores de servicios societarios."},
  23:{cat:"D", name:"APNFD: otras medidas", desc:"Exigir a abogados, notarios, contadores, comerciantes de metales preciosos y proveedores de servicios societarios reportar operaciones sospechosas en sus actividades específicas."},
  24:{cat:"E", name:"Transparencia y beneficiario final de las personas jurídicas", desc:"Asegurar información adecuada, precisa y actualizada sobre el beneficiario final de las personas jurídicas, accesible de forma rápida; prohibir las acciones al portador nuevas."},
  25:{cat:"E", name:"Transparencia y beneficiario final de otras estructuras jurídicas", desc:"Asegurar información adecuada y actualizada sobre los fideicomisos y estructuras similares: quién los constituyó (fideicomitente), quién los administra (fiduciario) y quién se beneficia."},
  26:{cat:"F", name:"Regulación y supervisión de las instituciones financieras", desc:"Contar con regulación y supervisión adecuadas de las instituciones financieras, prohibir los bancos pantalla, e impedir que criminales las controlen o dirijan."},
  27:{cat:"F", name:"Facultades de los supervisores", desc:"Los supervisores deben poder inspeccionar, exigir información y sancionar a las instituciones financieras que no cumplan con los requisitos ALA/CFT."},
  28:{cat:"F", name:"Regulación y supervisión de las APNFD", desc:"Los casinos requieren licencia y régimen estricto de supervisión; las demás APNFD deben ser supervisadas por una autoridad o un organismo autorregulador, según su riesgo."},
  29:{cat:"F", name:"Unidades de inteligencia financiera (UIF)", desc:"Establecer una Unidad de Inteligencia Financiera (UIF) como centro nacional para recibir y analizar Reportes de Operaciones Sospechosas y otra información relevante."},
  30:{cat:"F", name:"Responsabilidades de las autoridades de orden público e investigativas", desc:"Las autoridades de orden público deben investigar las finanzas de manera proactiva y en paralelo al delito, identificando y embargando con rapidez los bienes involucrados."},
  31:{cat:"F", name:"Facultades de las autoridades de orden público e investigativas", desc:"Las autoridades de orden público deben tener acceso a documentos, registros y testigos, y poder usar técnicas especiales como operaciones encubiertas e intercepción de comunicaciones."},
  32:{cat:"F", name:"Transporte de efectivo", desc:"Contar con un sistema de declaración o revelación para el transporte físico transfronterizo de efectivo por encima de USD/EUR 15,000, con sanciones ante declaraciones falsas."},
  33:{cat:"F", name:"Estadísticas", desc:"Mantener estadísticas amplias sobre Reportes de Operaciones Sospechosas, investigaciones, condenas, y bienes congelados, incautados y decomisados."},
  34:{cat:"F", name:"Guía y retroalimentación", desc:"Las autoridades, supervisores y organismos autorreguladores deben dar directrices y retroalimentación a las instituciones financieras y APNFD para aplicar las medidas ALA/CFT."},
  35:{cat:"F", name:"Sanciones", desc:"Contar con sanciones eficaces, proporcionales y disuasivas —penales, civiles o administrativas— para quienes incumplan los requisitos de las Recomendaciones 6 y 8 a la 23."},
  36:{cat:"G", name:"Instrumentos internacionales", desc:"Ratificar y aplicar a plenitud las convenciones de Viena, Palermo, contra la Corrupción de la ONU, y el Convenio Internacional contra el Financiamiento del Terrorismo."},
  37:{cat:"G", name:"Asistencia legal mutua", desc:"Prestar la más amplia asistencia legal mutua posible en casos de lavado de activos y financiamiento del terrorismo, sin negarla solo por motivos fiscales o de secreto bancario."},
  38:{cat:"G", name:"Asistencia legal mutua: congelamiento y decomiso", desc:"Actuar con rapidez ante solicitudes extranjeras de identificación, congelamiento, incautación y decomiso de bienes, pudiendo compartir o devolver lo decomisado."},
  39:{cat:"G", name:"Extradición", desc:"Ejecutar sin demora indebida las solicitudes de extradición por LA/FT; si un país no extradita a sus propios nacionales, debe juzgarlos internamente."},
  40:{cat:"G", name:"Otras formas de cooperación internacional", desc:"Prestar la más amplia cooperación internacional posible entre autoridades competentes —no solo UIF o judiciales—, de forma espontánea o a solicitud."}
};

const CATS = [
  {key:"A", color:"var(--A)", name:"Políticas y Coordinación ALA/CFT", range:[1,2]},
  {key:"B", color:"var(--B)", name:"Lavado de Activos y Decomiso", range:[3,4]},
  {key:"C", color:"var(--C)", name:"Financiamiento del Terrorismo y Proliferación", range:[5,8]},
  {key:"D", color:"var(--D)", name:"Medidas Preventivas", range:[9,23]},
  {key:"E", color:"var(--E)", name:"Transparencia y Beneficiario Final", range:[24,25]},
  {key:"F", color:"var(--F)", name:"Facultades de Autoridades Competentes", range:[26,35]},
  {key:"G", color:"var(--G)", name:"Cooperación Internacional", range:[36,40]}
];
const catColor = k => CATS.find(c=>c.key===k).color;

/* ---------- Setup screen ---------- */
let mode = null; // {type:'cat', key} or {type:'random', n}
let selectedCount = 8;

const catGrid = document.getElementById("catGrid");
CATS.forEach(c=>{
  const n = c.range[1]-c.range[0]+1;
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.style.setProperty("--c", c.color);
  btn.innerHTML = `<div class="name">${c.key} · ${c.name}</div><div class="count">${n} Recomendaciones (R${c.range[0]}–${c.range[1]})</div>`;
  btn.onclick = ()=>{ selectMode({type:"cat", key:c.key}); highlightButtons(btn); };
  catGrid.appendChild(btn);
});
const randomBtn = document.createElement("button");
randomBtn.className = "cat-btn";
randomBtn.style.setProperty("--c", "var(--gold)");
randomBtn.innerHTML = `<div class="name">🎲 Aleatorio</div><div class="count">Mezcla de las 40 Recomendaciones</div>`;
randomBtn.onclick = ()=>{ selectMode({type:"random"}); highlightButtons(randomBtn); document.getElementById("sizeBlock").style.display="block"; };
catGrid.appendChild(randomBtn);

function highlightButtons(active){
  document.querySelectorAll(".cat-btn").forEach(b=> b.classList.remove("active"));
  active.classList.add("active");
  if(active !== randomBtn) document.getElementById("sizeBlock").style.display="none";
}

const sizeRow = document.getElementById("sizeRow");
[6,8,10,12].forEach(n=>{
  const b = document.createElement("button");
  b.className = "size-btn" + (n===selectedCount ? " active":"");
  b.textContent = n + " parejas";
  b.onclick = ()=>{
    selectedCount = n;
    document.querySelectorAll(".size-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    if(mode && mode.type==="random"){ mode.n = n; document.getElementById("startBtn").disabled=false; }
  };
  sizeRow.appendChild(b);
});

function selectMode(m){
  mode = m;
  if(m.type==="random" && m.n===undefined) m.n = selectedCount;
  document.getElementById("startBtn").disabled = false;
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("hardModeBtn").addEventListener("click", ()=>{
  selectMode({type:"random", n:40});
  startGame();
});

/* ---------- Game state ---------- */
let pool = [];         // list of rec numbers in play
let cards = [];        // {rec, kind:'num'|'name', matched}
let flipped = [];      // currently flipped cell indices
let moves = 0, matches = 0, locked = false;
let foundRecs = [];    // recs already matched, in the order found
let reviewMode = false;
let currentCols = 4;

function pickPool(){
  let nums;
  if(mode.type==="cat"){
    const c = CATS.find(x=>x.key===mode.key);
    nums = []; for(let i=c.range[0]; i<=c.range[1]; i++) nums.push(i);
    if(nums.length > 12){ nums = shuffle(nums).slice(0,12); }
  } else {
    const all = Object.keys(REC).map(Number);
    nums = shuffle(all).slice(0, mode.n);
  }
  return nums;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startGame(){
  pool = pickPool();
  cards = [];
  pool.forEach(n=>{
    cards.push({rec:n, kind:"num", matched:false});
    cards.push({rec:n, kind:"name", matched:false});
  });
  cards = shuffle(cards);
  flipped = []; locked = false;
  moves = 0; matches = 0; foundRecs = [];
  updateStats();
  renderFoundChips();

  document.getElementById("statTotal").textContent = pool.length;
  document.getElementById("setup").style.display = "none";
  document.getElementById("endScreen").style.display = "none";
  document.getElementById("game").style.display = "block";

  const cols = cards.length <= 12 ? 4 : (cards.length <= 24 ? 6 : 8);
  currentCols = cols;
  document.getElementById("board").style.setProperty("--cols", cols);
  renderBoard();
}

function updateStats(){
  document.getElementById("statMatches").textContent = matches;
  document.getElementById("statMoves").textContent = moves;
}

function renderBoard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  cards.forEach((card, idx)=>{
    const cell = document.createElement("div");
    cell.className = "cell";
    const el = document.createElement("div");
    el.className = "card" + (card.matched ? " matched flipped":"");
    el.style.setProperty("--c", catColor(REC[card.rec].cat));

    const back = document.createElement("div");
    back.className = "face face-back";

    const front = document.createElement("div");
    front.className = "face face-front type-" + card.kind;
    if(card.kind==="num"){
      front.innerHTML = `<div class="big-num">${card.rec}</div><div class="sub">Recomendación</div>`;
    } else {
      const len = REC[card.rec].name.length;
      const scale = currentCols>=8 ? 0.78 : (currentCols===6 ? 0.9 : 1);
      const base = len<=12?22 : len<=20?18.5 : len<=28?17.5 : len<=38?16.5 : len<=50?16 : len<=65?15.5 : 15;
      const size = Math.round(base*scale*10)/10;
      front.innerHTML = `<div class="name-text" style="font-size:${size}px">${REC[card.rec].name}</div>`;
    }

    el.appendChild(back);
    el.appendChild(front);
    cell.appendChild(el);
    cell.onclick = ()=> flipCard(idx);
    board.appendChild(cell);
  });
}

function flipCard(idx){
  if(locked) return;
  const card = cards[idx];
  if(card.matched) return;
  if(flipped.includes(idx)) return;
  if(flipped.length===2) return;

  const cellEl = document.getElementById("board").children[idx].firstChild;
  cellEl.classList.add("flipped");
  flipped.push(idx);

  if(flipped.length===2){
    moves++; updateStats();
    const [i1,i2] = flipped;
    if(cards[i1].rec === cards[i2].rec){
      // match
      locked = true;
      setTimeout(()=>{
        cards[i1].matched = true; cards[i2].matched = true;
        matches++; updateStats();
        foundRecs.push(cards[i1].rec);
        renderFoundChips();
        flipped = [];
        showMatch(cards[i1].rec, false);
      }, 380);
    } else {
      locked = true;
      setTimeout(()=>{
        document.getElementById("board").children[i1].firstChild.classList.remove("flipped");
        document.getElementById("board").children[i2].firstChild.classList.remove("flipped");
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

function renderFoundChips(){
  const row = document.getElementById("foundRow");
  const box = document.getElementById("foundChips");
  if(foundRecs.length===0){ row.style.display="none"; return; }
  row.style.display = "block";
  box.innerHTML = "";
  foundRecs.forEach(n=>{
    const chip = document.createElement("button");
    chip.className = "found-chip";
    chip.style.setProperty("--c", catColor(REC[n].cat));
    chip.textContent = "R" + n;
    chip.title = REC[n].name;
    chip.onclick = ()=> showMatch(n, true);
    box.appendChild(chip);
  });
}

function showMatch(recNum, isReview){
  reviewMode = !!isReview;
  const r = REC[recNum];
  document.getElementById("mNum").textContent = recNum;
  document.getElementById("mNum").style.color = catColor(r.cat);
  document.getElementById("matchCard").style.setProperty("--c", catColor(r.cat));
  document.getElementById("mName").textContent = r.name;
  document.getElementById("mDesc").textContent = r.desc;
  document.querySelector("#matchCard .tag").textContent = isReview ? "Repasando" : "¡Pareja encontrada!";
  document.getElementById("overlay").style.display = "flex";
}

document.getElementById("mContinue").addEventListener("click", ()=>{
  document.getElementById("overlay").style.display = "none";
  if(!reviewMode){
    locked = false;
    if(matches === pool.length){
      setTimeout(endGame, 200);
    }
  }
  reviewMode = false;
});

function endGame(){
  document.getElementById("game").style.display = "none";
  document.getElementById("endScreen").style.display = "block";
  document.getElementById("endStats").textContent =
    `${pool.length} parejas encontradas en ${moves} intentos.`;
}

document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("playAgainBtn").addEventListener("click", startGame);
document.getElementById("changeBtn").addEventListener("click", backToSetup);
document.getElementById("endChangeBtn").addEventListener("click", backToSetup);

function backToSetup(){
  document.getElementById("game").style.display = "none";
  document.getElementById("endScreen").style.display = "none";
  document.getElementById("setup").style.display = "block";
}
</script>
</body>
</html>
