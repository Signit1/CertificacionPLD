<title>Juegos PLD/FT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Spectral:wght@600;700&display=swap');
/* Layout: una pantalla de navegación en 3 niveles (ley -> juego -> partida), tarjetas tipo fichero/expediente */
:root{
  --bg:#faf8f4; --panel:#ffffff; --ink:#1c1c1c; --muted:#6b6652; --line:#dcd6c8;
  --navy:#12233d; --teal:#0f7d82; --gold:#c99a3b; --red:#b5432b; --green:#2f6b4f;
  --accent:#0f7d82; --accent-ink:#ffffff; --good:#2f6b4f; --bad:#b5432b; --shadow:0 2px 10px rgba(20,20,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --panel:#1f1d17; --ink:#f2efe6; --muted:#a39d88; --line:#3a382e;
    --navy:#8fb3e8; --teal:#5fd4d9; --gold:#e6bf6b; --red:#ef8468; --green:#7fcba3;
    --accent:#5fd4d9; --accent-ink:#0d1a1a; --shadow:0 2px 14px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --panel:#1f1d17; --ink:#f2efe6; --muted:#a39d88; --line:#3a382e;
  --navy:#8fb3e8; --teal:#5fd4d9; --gold:#e6bf6b; --red:#ef8468; --green:#7fcba3;
  --accent:#5fd4d9; --accent-ink:#0d1a1a; --shadow:0 2px 14px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Source Sans 3','Helvetica Neue',Arial,sans-serif; -webkit-tap-highlight-color:transparent;}
h1,h2,h3,.disp{font-family:'Spectral',Georgia,serif;}
#app{max-width:980px; margin:0 auto; padding:18px 16px 48px; padding-block:18px 48px;}
header.top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
header.top h1{font-size:clamp(20px,4vw,28px); margin:0; color:var(--navy);}
header.top .tag{font-size:12.5px; color:var(--muted);}
.crumbs{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap;}
.crumbs button{background:none; border:none; color:var(--teal); cursor:pointer; font-size:13px; padding:2px 0; text-decoration:underline; font-family:inherit;}
.crumbs span.sep{color:var(--line);}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s ease, border-color .12s ease; text-align:left;}
.card:hover{transform:translateY(-2px); border-color:var(--accent);}
.card .icon{font-size:28px; display:block; margin-bottom:8px;}
.card h3{margin:0 0 4px; font-size:16px; color:var(--ink);}
.card p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.4;}
.card .count{display:inline-block; margin-top:8px; font-size:11px; font-weight:700; letter-spacing:.03em; padding:3px 9px; border-radius:20px; background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);}
.card.mixed{background:linear-gradient(135deg, color-mix(in srgb, var(--navy) 90%, transparent), color-mix(in srgb, var(--teal) 70%, var(--navy)));}
.card.mixed h3, .card.mixed p, .card.mixed .icon{color:#fff;}
.card.mixed .count{background:rgba(255,255,255,.22); color:#fff;}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:var(--shadow);}
.btn{font-family:inherit; font-size:14px; font-weight:600; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 16px; cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn:disabled{opacity:.45; cursor:default;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.rowbetween{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:14px;}

.clues{display:grid; gap:7px; margin-top:14px;}
.clue-item{display:flex; gap:9px; align-items:baseline; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:color-mix(in srgb, var(--panel) 85%, var(--bg));}
.clue-item.found{opacity:.55; text-decoration:line-through; border-color:var(--good);}
.clue-item b{color:var(--teal); white-space:nowrap;}

/* Sopa de letras */
.wsgrid{display:grid; gap:2px; user-select:none; margin:0 auto; touch-action:none;}
.wsgrid .cell{display:flex; align-items:center; justify-content:center; aspect-ratio:1; font-size:13px; font-weight:700; background:color-mix(in srgb, var(--bg) 60%, var(--panel)); border-radius:3px; cursor:pointer;}
.wsgrid .cell.sel{background:color-mix(in srgb, var(--gold) 55%, var(--panel));}
.wsgrid .cell.found{background:color-mix(in srgb, var(--good) 45%, var(--panel)); color:var(--good);}

/* Crucigrama */
.cwwrap{overflow-x:auto; padding-bottom:6px;}
.cwgrid{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); width:max-content; margin:0 auto;}
.cwcell{width:30px; height:30px; position:relative; background:var(--panel);}
.cwcell.block{background:transparent;}
.cwcell input{width:100%; height:100%; border:none; background:transparent; text-align:center; font-size:14px; font-weight:700; text-transform:uppercase; color:var(--ink); font-family:inherit;}
.cwcell input:focus{outline:2px solid var(--accent); outline-offset:-2px;}
.cwcell input.ok{color:var(--good);}
.cwcell input.bad{color:var(--bad);}
.cwcell .num{position:absolute; top:1px; left:2px; font-size:8px; color:var(--muted); font-weight:700;}
.cluecols{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:16px;}
@media (max-width:560px){.cluecols{grid-template-columns:1fr;}}
.cluecols h4{margin:0 0 6px; font-size:13px; color:var(--teal); text-transform:uppercase; letter-spacing:.04em;}
.cluecols ul{margin:0; padding-left:0; list-style:none; font-size:13px; display:grid; gap:7px;}
.cluecols li{line-height:1.4;}

/* Memorama */
.memgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px;}
@media (max-width:480px){.memgrid{grid-template-columns:repeat(3,1fr);}}
.memcard{aspect-ratio:3/4; border-radius:8px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; font-size:12px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); line-height:1.25;}
.memcard.flip{background:var(--panel); color:var(--ink); border:1px solid var(--accent);}
.memcard.num{font-family:'Spectral',serif; font-size:15px;}
.memcard.matched{background:color-mix(in srgb, var(--good) 30%, var(--panel)); color:var(--good); cursor:default; border:1px solid var(--good);}
.memcard.mismatch{background:color-mix(in srgb, var(--bad) 16%, var(--panel)); color:var(--ink); border:1px solid var(--bad);}

/* Relaciona las columnas */
.matchwrap{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
@media (max-width:560px){.matchwrap{grid-template-columns:1fr;}}
.matchcol{display:grid; gap:10px; align-content:start;}
.matchcard{padding:12px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); font-size:13.5px; line-height:1.4; transition:border-color .15s, background .15s;}
.matchcard.left{cursor:grab; cursor:pointer;}
.matchcard.left.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--panel));}
.matchcard.right{text-align:center; font-weight:700; font-family:'Spectral',serif; font-size:16px; display:flex; align-items:center; justify-content:center; min-height:88px; padding:16px; border-width:2px; cursor:pointer;}
.matchcard.matched{cursor:default; font-weight:600; border-width:2px;}
.matchcard.right.dragover{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--panel)); transform:scale(1.04);}
.matchcard.shake{animation:shake .4s;}
@keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(3px);} 30%,50%,70%{transform:translateX(-5px);} 40%,60%{transform:translateX(5px);} }

/* VF / trampa / completa */
.statement{font-size:16.5px; line-height:1.5; padding:18px; border-radius:9px; background:color-mix(in srgb, var(--bg) 60%, var(--panel)); border:1px solid var(--line); margin-bottom:16px;}
.opt{display:block; width:100%; text-align:left; padding:11px 14px; margin-bottom:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); font-family:inherit; font-size:14px; cursor:pointer; color:var(--ink);}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:color-mix(in srgb, var(--good) 22%, var(--panel)); border-color:var(--good);}
.opt.wrong{background:color-mix(in srgb, var(--bad) 22%, var(--panel)); border-color:var(--bad);}
.opt:disabled{cursor:default;}
.feedback{margin-top:10px; padding:12px 14px; border-radius:8px; font-size:13.5px; line-height:1.45;}
.feedback.good{background:color-mix(in srgb, var(--good) 18%, var(--panel)); color:var(--good);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 18%, var(--panel)); color:var(--bad);}
.hud{display:flex; gap:18px; font-size:13px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap;}
.hud b{color:var(--ink); font-variant-numeric:tabular-nums;}
.timerbar{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:16px;}
.timerbar div{height:100%; background:var(--accent); transition:width 1s linear;}

/* Trivia */
.jboard{display:grid; gap:6px; overflow-x:auto;}
.jcat{font-size:11.5px; font-weight:700; text-align:center; padding:8px 4px; background:var(--navy); color:#fff; border-radius:6px; text-transform:uppercase; letter-spacing:.02em;}
.jcell{aspect-ratio:1.3; display:flex; align-items:center; justify-content:center; background:var(--teal); color:#fff; font-weight:700; font-size:15px; border-radius:6px; cursor:pointer; font-family:'Spectral',serif;}
.jcell.used{background:var(--line); color:var(--muted); cursor:default;}
.jmodal{position:fixed; inset:0; background:rgba(10,10,8,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;}
.jmodal .box{background:var(--panel); border-radius:12px; padding:28px; max-width:480px; width:100%; text-align:center; box-shadow:var(--shadow);}
.jmodal .box .q{font-size:18px; margin-bottom:18px; line-height:1.4;}
.jmodal .box .a{font-size:20px; font-weight:700; color:var(--teal); margin-bottom:18px; font-family:'Spectral',serif;}

footer.foot{text-align:center; font-size:12px; color:var(--muted); padding:24px 0 6px;}
.empty{text-align:center; padding:30px; color:var(--muted); font-size:14px;}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";

/* ================= DATA ================= */
const LAWS = [
  { id:'cpf', label:'CPF', full:'Código Penal Federal (CPF)', icon:'⚖️', color:'#b5432b', items:[
    {num:'400 Bis', topic:'Lavado de Dinero (LD) — pena de 5 a 15 años y 1,000 a 5,000 días multa', word:'LAVADODEDINERO', clue:'Delito de adquirir, administrar, ocultar o transferir recursos sabiendo que provienen de una actividad ilícita (Art. 400 Bis)',

    {num:'400 Bis 1', topic:'Agravantes del Lavado de Dinero (LD) — hasta +50%, duplicada o inhabilitación', word:'AGRAVANTES', clue:'Artículo que aumenta hasta en una mitad, o duplica, la pena del Art. 400 Bis según quién cometa el delito',
      detail:'No tiene pena propia: aumenta de un tercio hasta en una mitad la pena del Art. 400 Bis cuando lo comete un consejero, administrador, funcionario, empleado o prestador de servicios de una persona sujeta al régimen de PLD/FT (o lo fue en los 2 años anteriores), con inhabilitación adicional por un tiempo igual al de la prisión. Duplica la pena si lo comete un servidor público —o ex servidor público, dentro de los 2 años posteriores— encargado de prevenir, detectar, denunciar, investigar o juzgar estos delitos. También la aumenta hasta en una mitad si se utilizan menores de edad o personas sin capacidad de comprender el hecho.'},
    {num:'400', topic:'Encubrimiento — pena de 3 meses a 3 años y 15 a 60 días multa (menor que la de LD)', word:'ENCUBRIMIENTO', clue:'Ayudar a quien ya cometió un delito a ocultarse o beneficiarse, sin haber participado en él (Art. 400, distinto del Lavado de Dinero)',
      detail:'Tipifica el Encubrimiento: ayudar a alguien que ya cometió un delito a ocultar pruebas, a huir o a aprovechar lo obtenido, sin haber participado en el delito original. Su pena es de 3 meses a 3 años de prisión y de 15 a 60 días multa, notablemente menor a la de Lavado de Dinero (LD): el encubrimiento no requiere que el recurso se intente reinsertar en la economía formal, basta con ocultarlo o ayudar a quien delinquió.'},
    {num:'139', topic:'Terrorismo — pena de 15 a 40 años y multa de 400 a 1,200 UMA', word:'TERRORISMO', clue:'Delito de realizar actos violentos contra bienes, servicios o personas para causar alarma o terror y presionar a la autoridad (Art. 139)',
      detail:'Tipifica el delito de Terrorismo: usar sustancias tóxicas, armas, explosivos, incendio, inundación o cualquier medio violento para realizar actos contra bienes, servicios o la vida de las personas, que produzcan alarma, temor o terror en la población o en un sector de ella, para atentar contra la seguridad nacional o presionar a la autoridad. Pena: 15 a 40 años de prisión y multa de 400 a 1,200 veces el valor diario de la Unidad de Medida y Actualización (UMA). La pena aumenta en una mitad si el delito es contra un inmueble de acceso público, genera daño a la economía nacional, o se toma un rehén.'},
    {num:'139 Bis', topic:'Encubrir a un terrorista — pena de 1 a 9 años', word:'ENCUBRETERRORISTA', clue:'Conducta de quien encubre a un terrorista conociendo sus actividades o su identidad (Art. 139 Bis)',
      detail:'Sanciona con 1 a 9 años de prisión y 100 a 300 días multa a quien encubra a un terrorista, teniendo conocimiento de sus actividades o de su identidad.'},
    {num:'139 Ter', topic:'Amenazar con cometer terrorismo — pena de 5 a 15 años', word:'AMENAZATERRORISTA', clue:'Conducta de quien amenaza con cometer el delito de terrorismo del Art. 139 (Art. 139 Ter)',

    {num:'139 Quáter', topic:'Financiamiento al Terrorismo (FT) — misma pena que el Art. 139', word:'FINANCIAMIENTOTERRORISMO', clue:'Delito de aportar o recaudar fondos sabiendo que se usarán para financiar actividades terroristas (Art. 139 Quáter, FT)',
      detail:'Tipifica el Financiamiento al Terrorismo (FT): aportar o recaudar fondos o recursos de cualquier naturaleza, por cualquier medio, directa o indirectamente, con conocimiento de que se destinarán a financiar o apoyar a individuos u organizaciones terroristas, o para cometer terrorismo, sabotaje, terrorismo internacional, ataques a vías de comunicación o robo. Se impone la misma pena que el Art. 139: 15 a 40 años de prisión y multa de 400 a 1,200 UMA. Es, junto con el Art. 400 Bis, el fundamento penal del régimen de PLD/FT.'},
    {num:'139 Quinquies', topic:'Encubrir el financiamiento al terrorismo — pena de 1 a 9 años', word:'ENCUBREFINANCIAMIENTO', clue:'Conducta de quien encubre a una persona que participó en el delito del Art. 139 Quáter (Art. 139 Quinquies)',
      detail:'Sanciona con 1 a 9 años de prisión y 100 a 300 días multa a quien encubra a una persona que haya participado en el delito de Financiamiento al Terrorismo (FT) previsto en el Art. 139 Quáter.'},
    {num:'148 Bis', topic:'Terrorismo Internacional — pena de 15 a 40 años (contra bienes o personas de otro Estado)', word:'TERRORISMOINTERNACIONAL', clue:'Delito similar al Art. 139, pero contra bienes, personas o funcionarios de un Estado extranjero u organismo internacional (Art. 148 Bis)',
      detail:'Tipifica el Terrorismo Internacional: realizar en territorio mexicano actos violentos contra bienes, personas o servicios de un Estado extranjero o de un organismo internacional, o contra una "persona internacionalmente protegida" (jefes de Estado o de gobierno, ministros de relaciones exteriores, diplomáticos y sus familias). Pena: 15 a 40 años de prisión y multa de 400 a 1,200 días multa, la misma del Art. 139 pero para actos con proyección internacional. Es, junto con los Arts. 139 y 400 Bis, uno de los tres delitos para los que la Ley de la CNBV (Art. 4, fracc. X) exige certificar a los auditores y oficiales de cumplimiento.'},
    {num:'29', topic:'Definición de "día multa" — tope de 1,000 días multa salvo que la ley diga otra cosa', word:'DIAMULTA', clue:'Unidad con la que el CPF calcula multas, basada en el ingreso diario del sentenciado (Art. 29)',
      detail:'Define qué es un "día multa": equivale a la percepción neta diaria de la persona sentenciada al momento de cometer el delito, considerando todos sus ingresos, con un límite inferior igual al salario mínimo diario vigente donde se cometió el delito. Por regla general, los días multa de una sanción no pueden exceder de 1,000, salvo que la propia ley señale otra cosa. No debe confundirse con la Unidad de Medida y Actualización (UMA), que es la referencia que sí usan la LFPIORPI y otras leyes administrativas para fijar montos y umbrales.'},
  ]},
  { id:'lic', label:'LIC', full:'Ley de Instituciones de Crédito (LIC)', icon:'🏦', color:'#12233d', items:[

    {num:'2', topic:'Qué es el "servicio de banca y crédito" y quién puede prestarlo', word:'CAPTACION', clue:'Lo que hace una institución al recibir recursos del público para después colocarlos (Art. 2 LIC, servicio de banca y crédito)',
      detail:'No repite el objeto de la ley (eso es el Art. 1): define qué se considera "servicio de banca y crédito" —la captación de recursos del público en el mercado nacional para su colocación entre el público, mediante operaciones de pasivo directo o contingente— y aclara que solo pueden prestarlo las instituciones de banca múltiple y de banca de desarrollo.'},
    {num:'115', topic:'Sostiene todo el régimen de Prevención de Lavado de Dinero y Financiamiento al Terrorismo (PLD/FT) bancario', word:'REGIMENPLDFT', clue:'Conjunto de medidas que deben seguir los bancos para prevenir el lavado de dinero y el financiamiento al terrorismo (Art. 115 LIC)',
      detail:'Es el artículo que sostiene todo el régimen de Prevención de Lavado de Dinero y Financiamiento al Terrorismo (PLD/FT) de la banca: obliga a las instituciones de crédito a establecer medidas y procedimientos para prevenir y detectar actos que pudieran favorecer el lavado de dinero, y faculta a la autoridad para desarrollar esas obligaciones en detalle mediante disposiciones de carácter general — de ahí nace la DCG 115.'},
    {num:'109', topic:'Multa "cajón de sastre" — 2,000 a 10,000 días de salario o 0.1% a 1% del capital', word:'CAJONDESASTRE', clue:'Artículo que sanciona cualquier incumplimiento de la LIC o sus disposiciones (como la DCG 115) que no tenga una multa específica en otro artículo (Art. 109)',
      detail:'Es la sanción "cajón de sastre" de la LIC: castiga la infracción a cualquier precepto de la Ley o de las disposiciones que de ella deriven —incluida la DCG 115, por ejemplo no presentar a tiempo el reporte trimestral de operaciones con Activos Virtuales (Disposición 34ª Quáter)— que no tenga una sanción específica señalada en otro artículo. La multa es de 2,000 a 10,000 días de salario, o del 0.1% al 1% del capital pagado y reservas de capital de la institución, según la gravedad de la infracción. La CNBV puede solo amonestar cuando la conducta no sea grave, no haya reincidencia y no ponga en riesgo a terceros o al sistema financiero.'},
  ]},

    {num:'4ª', topic:'Expediente de identificación del Cliente', word:'IDENTIFICACION', clue:'Conjunto de datos y documentos que la institución debe integrar y conservar de cada Cliente antes de abrir una cuenta (Disposición 4ª)',

      detail:'Regula qué datos adicionales deben recabar las instituciones cuando los Fideicomisos actúan como Usuarios en una operación: el número o referencia del Fideicomiso, su Registro Federal de Contribuyentes (RFC), la denominación de la fiduciaria, y el nombre completo del representante legal, apoderado o delegado fiduciario.'},
    {num:'4ª Ter', topic:'Identificación no presencial (a distancia)', word:'NOPRESENCIAL', clue:'Modalidad de apertura de cuenta a distancia que exige, además de los datos de la 4ª, la Geolocalización del Dispositivo (Disposición 4ª Ter)',
      detail:'Regula bajo qué condiciones se permite la identificación no presencial: cuando una institución abre una cuenta o celebra un contrato a través de Dispositivos, sin que el Cliente acuda físicamente, debe requerir y obtener —además de los datos de identificación de la Disposición 4ª— la Geolocalización del Dispositivo desde el cual se realiza la apertura, así como el consentimiento del Cliente mediante Firma Electrónica o Firma Electrónica Avanzada.'},
    {num:'14ª Bis', topic:'Cuentas Nivel 1 a 4 (montos en Unidades de Inversión, UDI)', word:'NIVELESCUENTA', clue:'Clasificación de cuentas en 4 categorías según el monto mensual permitido (Disposición 14ª Bis)',
      detail:'Clasifica las cuentas en cuatro niveles (Nivel 1 a Nivel 4) según el monto máximo mensual de abonos permitido, expresado en Unidades de Inversión (UDI). A menor nivel, menos documentación de identificación se exige al Cliente, pero también es menor el monto que puede manejar; los cuatro niveles son fracciones de esta misma disposición, no cuatro reglas distintas.'},
    {num:'24ª', topic:'Conocimiento del Cliente y perfil transaccional', word:'PERFILCLIENTE', clue:'Expectativa de comportamiento transaccional que se construye para cada Cliente (Disposición 24ª)',
      detail:'Obliga a las instituciones a construir un perfil transaccional de cada Cliente, con base en su actividad, sus ingresos declarados y su comportamiento esperado, para poder comparar sus operaciones reales contra ese perfil y detectar cuándo algo se sale de lo normal — la base técnica del Conocimiento del Cliente.'},
    {num:'33ª', topic:'Dólares en efectivo — tope mensual Persona Física/Moral (PF/PM)', word:'DOLARESEFECTIVO', clue:'Depósitos en moneda extranjera que la Disposición 33ª limita mensualmente por Cliente PF/PM',
      detail:'Fija el tope mensual que una institución puede recibir en dólares en efectivo de un mismo Cliente, sea Persona Física o Persona Moral (PF/PM), antes de requerir alguno de los regímenes reforzados de las disposiciones siguientes (33ª Bis o 33ª Bis 1).'},
    {num:'33ª Bis', topic:'Dólares en efectivo — régimen de 14,000 USD al mes', word:'LIMITEMENSUAL', clue:'Tope de 14,000 USD al mes en depósitos de dólares en efectivo, sin exigir antigüedad (Disposición 33ª Bis)',
      detail:'Crea el régimen de dólares en efectivo con un límite de 14,000 USD al mes por Cliente, que no exige que la empresa tenga una antigüedad mínima: es el régimen "estándar" para operar en efectivo en dólares dentro de ese tope.'},
    {num:'33ª Bis 1', topic:'Dólares en efectivo — régimen sin límite (requiere 3 años de constituida)', word:'SINLIMITE', clue:'Régimen de dólares en efectivo sin tope mensual, que exige 3 años de constituida entre sus 6 requisitos (Disposición 33ª Bis 1)',
      detail:'Crea el régimen de dólares en efectivo SIN límite mensual, pero a cambio exige cumplir 6 requisitos reforzados, entre ellos que la empresa tenga al menos 3 años de constituida. Este es el dato que suele confundirse en el examen: el requisito de los 3 años es de este régimen sin límite (33ª Bis 1), no del tope de 14,000 USD de la 33ª Bis.'},
    {num:'33ª Ter', topic:'Dólares en efectivo — régimen para Usuarios (no Clientes)', word:'USUARIOS', clue:'Personas que reciben un servicio puntual, como cambiar dólares, sin ser Clientes formales (Disposición 33ª Ter)',
      detail:'Regula el régimen de dólares en efectivo aplicable a los Usuarios: personas que reciben un servicio puntual, como cambiar dólares, sin ser Clientes formales de la institución, con montos distintos a los que aplican cuando sí hay una relación de Cliente.'},
    {num:'34ª', topic:'Operaciones Relevantes', word:'RELEVANTES', clue:'Tipo de operación que se reporta por superar un monto, sin que sea necesariamente sospechosa (Disposición 34ª)',
      detail:'Define qué es una Operación Relevante: aquella que, por superar cierto monto en efectivo, debe reportarse a la autoridad aunque no tenga nada de sospechoso — es un reporte que se dispara por el monto, no por sospecha.'},
    {num:'34ª Quáter', topic:'Activos Virtuales', word:'ACTIVOVIRTUAL', clue:'Lo que comúnmente se conoce como criptomoneda (Disposición 34ª Quáter)',
      detail:'Extiende las obligaciones de identificación y reporte a las operaciones con Activos Virtuales (lo que comúnmente se conoce como criptomonedas) cuando una institución financiera las ofrece a sus Clientes.'},
    {num:'35ª', topic:'Reporte mensual de Transferencias Internacionales de Fondos (TIF)', word:'TRANSFERENCIAS', clue:'Reporte mensual que se envía por cada transferencia internacional igual o superior a 1,000 USD (Disposición 35ª, TIF)',
      detail:'Obliga a las instituciones a remitir mensualmente, dentro de los 15 días hábiles siguientes, un reporte por cada Transferencia Internacional de Fondos (TIF) que un Cliente o Usuario haya recibido o enviado por un monto igual o superior a 1,000 dólares de los Estados Unidos de América (o su equivalente), señalando los países o jurisdicciones involucrados.'},
    {num:'36ª', topic:'Datos adicionales en TIF para pago de remesas', word:'REMESAS', clue:'Información adicional sobre el Destinatario que deben especificar las instituciones que pagan remesas del extranjero (Disposición 36ª)',
      detail:'Complementa a la Disposición 35ª: cuando la Transferencia Internacional de Fondos (TIF) es para pago de remesas que la institución recibe directamente del extranjero o a través de Transmisores de Dinero, por montos iguales o superiores a 1,000 USD, debe especificar datos adicionales del Destinatario —nombre completo, fecha de nacimiento, Clave Única de Registro de Población (CURP) o Registro Federal de Contribuyentes (RFC) si es persona física, o denominación y giro mercantil si es persona moral.'},
    {num:'37ª', topic:'Operación Inusual — plazo de 3 días hábiles', word:'INUSUAL', clue:'Operación que no coincide con el perfil del Cliente ni tiene justificación aparente (Disposición 37ª)',
      detail:'Define la Operación Inusual: una operación que no coincide con el perfil transaccional del Cliente, o que no tiene una justificación económica o lícita aparente. La institución tiene un plazo de 3 días hábiles, contados desde que la detecta internamente, para analizarla y decidir si debe reportarse.'},
    {num:'41ª', topic:'Reporte de 24 horas (Lavado de Dinero, LD, y Financiamiento al Terrorismo, FT)', word:'REPORTEURGENTE', clue:'Aviso que debe enviarse en 24 horas al detectar un vínculo claro con LD o FT (Disposición 41ª)',
      detail:'Crea el Reporte de 24 horas: cuando una institución detecta una operación que relaciona claramente a un cliente con posibles recursos de Lavado de Dinero (LD) o Financiamiento al Terrorismo (FT) —por ejemplo, al aparecer en una lista de personas vinculadas al crimen organizado— debe reportarlo a la autoridad en ese plazo tan corto, sin esperar al reporte mensual ordinario.'},
    {num:'43ª', topic:'Funciones del Comité de Comunicación y Control', word:'COMITECONTROL', clue:'Órgano interno que aprueba el Manual de Cumplimiento y dictamina qué operaciones se reportan como inusuales (Disposición 43ª)',
      detail:'Crea al Comité de Comunicación y Control y enlista sus funciones: aprobar el Manual de Cumplimiento, conocer los resultados de auditoría, clasificar a los Clientes de alto riesgo, dictaminar qué Operaciones deben reportarse como Inusuales u Operaciones Internas Preocupantes, y aprobar los programas de capacitación en materia de los Arts. 139 Quáter o 400 Bis del Código Penal Federal (CPF).'},
    {num:'44ª', topic:'Integración del Comité — mínimo 3 miembros, Auditor Interno solo con voz', word:'INTEGRACIONCOMITE', clue:'Número mínimo de miembros que debe tener el Comité de Comunicación y Control, y cómo participa el Auditor Interno (Disposición 44ª)',
      detail:'Regula la integración del Comité: debe tener al menos 3 miembros titulares de las áreas designadas por el consejo de administración, y sesionar al menos una vez al mes. El Auditor Interno no forma parte del Comité, pero debe participar en sus sesiones con voz, sin voto. Las Entidades con menos de 25 personas a su servicio no están obligadas a constituir el Comité; sus funciones las asume el Oficial de Cumplimiento.'},
    {num:'45ª', topic:'Votación y actas del Comité', word:'VOTACIONCOMITE', clue:'Mayoría necesaria para que el Comité tome decisiones, y qué documento debe levantarse de cada sesión (Disposición 45ª)',
      detail:'Fija cómo decide el Comité de Comunicación y Control: por voto favorable de la mayoría de los miembros presentes, con voto de calidad del presidente en caso de empate; de cada sesión debe levantarse un acta firmada por el presidente y el secretario, y conservarse la documentación que justifique por qué se reportó o no cada Operación analizada.'},
    {num:'72ª', topic:'Qué hacer al encontrar a un Cliente en la Lista de Personas Bloqueadas', word:'LISTABLOQUEADA', clue:'Medida inmediata que debe tomar la institución al identificar a un Cliente en la Lista de Personas Bloqueadas (Disposición 72ª)',
      detail:'Obliga a la institución, al identificar que un Cliente o Usuario está en la Lista de Personas Bloqueadas, a: (I) suspender de inmediato cualquier acto u operación con esa persona, y (II) remitir a la autoridad, dentro de 24 horas, un reporte de Operación Inusual con la leyenda "Lista de Personas Bloqueadas". Debe además notificar por escrito al Cliente la causa de su inclusión.'},
    {num:'73ª', topic:'Derecho de audiencia de la persona incluida en la Lista', word:'AUDIENCIABLOQUEADA', clue:'Procedimiento ante la UIF que puede seguir una persona para impugnar su inclusión en la Lista de Personas Bloqueadas (Disposición 73ª)',
      detail:'Da a la persona incluida en la Lista de Personas Bloqueadas el derecho de audiencia ante el Titular de la Unidad de Inteligencia Financiera (UIF): tiene 10 días hábiles para manifestar lo que a su derecho convenga y aportar pruebas, y la UIF debe resolver si procede o no su eliminación de la Lista dentro de los 10 días hábiles siguientes.'},
  ]},
  { id:'lgoaac', label:'LGOAAC', full:'Ley General de Organizaciones y Actividades Auxiliares del Crédito (LGOAAC)', icon:'💱', color:'#5c4a8a', items:[
    {num:'3o.', topic:'Único que sigue vigente como organización auxiliar del crédito: Almacenes Generales de Depósito', word:'ALMACENES', clue:'Única organización auxiliar del crédito que sigue vigente bajo este artículo (Art. 3o. LGOAAC)',
      detail:'Establece qué entidades siguen reguladas como "organización auxiliar del crédito" bajo esta ley. En la práctica, casi todas las demás figuras que históricamente estaban aquí ya migraron a otras leyes, y la única que sigue verdaderamente vigente bajo este artículo son los Almacenes Generales de Depósito: empresas que guardan mercancía y emiten certificados que sirven como garantía para créditos.'},
    {num:'81-A', topic:'Qué es un Centro Cambiario', word:'CENTROCAMBIARIO', clue:'Empresa que compra y vende divisas al menudeo sin poder captar recursos del público (Art. 81-A LGOAAC)',
      detail:'Define qué es un Centro Cambiario: una empresa que se dedica, de manera profesional, a la compra y venta de divisas (cambio de moneda extranjera) en operaciones al menudeo, pero que no puede captar recursos del público como lo hace un banco.'},
    {num:'81-A Bis', topic:'Qué es un Transmisor de Dinero', word:'TRANSMISOR', clue:'Empresa que recibe dinero en un lugar para entregarlo en otro, por cuenta del cliente (Art. 81-A Bis LGOAAC)',
      detail:'Define qué es un Transmisor de Dinero: una empresa que se dedica a recibir dinero en un lugar para entregarlo, por cuenta del cliente, a otra persona en un lugar distinto —por ejemplo, remesas— sin que medie una cuenta bancaria del cliente ni una operación de cambio de divisas por sí misma.'},
    {num:'86 Bis', topic:'Dictamen Técnico de Centros Cambiarios y Transmisores de Dinero', word:'DICTAMENTECNICO', clue:'Documento de un auditor externo que certifica el cumplimiento operativo de Centros Cambiarios y Transmisores (Art. 86 Bis)',
      detail:'Obliga a los Centros Cambiarios y a los Transmisores de Dinero a presentar, ante la Comisión Nacional Bancaria y de Valores (CNBV), un Dictamen Técnico elaborado por un auditor externo que certifique que cumplen con los requisitos operativos y de control que exige la ley para poder funcionar.'},
    {num:'87-C', topic:'Vínculo patrimonial — distingue Sociedad Financiera de Objeto Múltiple Entidad Regulada (SOFOM ER) de Entidad No Regulada (SOFOM ENR)', word:'PATRIMONIAL', clue:'Tipo de vínculo que distingue a una SOFOM ER de una SOFOM ENR (Art. 87-C LGOAAC)',
      detail:'Distingue, por su vínculo patrimonial con un banco u otra entidad financiera regulada, a la Sociedad Financiera de Objeto Múltiple Entidad Regulada (SOFOM ER) de la Entidad No Regulada (SOFOM ENR): si la SOFOM tiene una relación accionaria o patrimonial con una institución de crédito o entidad financiera regulada, es ER; si opera de forma totalmente independiente, es ENR.'},
    {num:'87-P', topic:'Dictamen Técnico de la Sociedad Financiera de Objeto Múltiple Entidad No Regulada (SOFOM ENR)', word:'SOFOMENR', clue:'Sociedad Financiera de Objeto Múltiple que presenta su propio Dictamen Técnico ante la CNBV (Art. 87-P LGOAAC)',
      detail:'Exige a la Sociedad Financiera de Objeto Múltiple Entidad No Regulada (SOFOM ENR) presentar su propio Dictamen Técnico ante la Comisión Nacional Bancaria y de Valores (CNBV), de forma paralela al que deben presentar los Centros Cambiarios y Transmisores de Dinero bajo el Art. 86 Bis.'},
    {num:'95 Bis', topic:'Obligaciones de Prevención de Lavado de Dinero y Financiamiento al Terrorismo (PLD/FT) conjuntas de Centros Cambiarios, Transmisores de Dinero y SOFOM ENR', word:'OBLIGACIONES', clue:'Lo que el Art. 95 Bis impone de forma conjunta a Centros Cambiarios, Transmisores de Dinero y SOFOM ENR',
      detail:'Impone, de manera conjunta, las obligaciones de Prevención de Lavado de Dinero y Financiamiento al Terrorismo (PLD/FT) —identificación de clientes, conservación de expedientes, reportes a la autoridad, etc.— a los Centros Cambiarios, los Transmisores de Dinero y las SOFOM ENR. Es la "trampa clásica" del examen: el Art. 95 (sin "Bis") NO regula esto, solo es un requisito de querella penal para poder perseguir ciertos delitos.'},
  ]},
  { id:'lfpiorpi', label:'LFPIORPI', full:'Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita (LFPIORPI)', icon:'🕵️', color:'#2f6b4f', items:[
    {num:'3, fracc. III', topic:'Definición de Beneficiario Controlador', word:'CONTROLADORDEF', clue:'Persona física que, sin aparecer como titular, obtiene en última instancia el beneficio de un bien o servicio, o controla a un Cliente (Art. 3, fracc. III)',
      detail:'Define al Beneficiario Controlador: la persona física o grupo de personas físicas que, directamente o por medio de otra persona, obtiene en última instancia el beneficio del uso o aprovechamiento de un bien o servicio, o ejerce el control de un Cliente o Usuario, aunque no aparezca formalmente como titular.'},
    {num:'3, fracc. IX Bis', topic:'Definición de Persona Políticamente Expuesta (PEP)', word:'PEP', clue:'Quien desempeña o desempeñó un cargo público de alto nivel, en México o en el extranjero (Art. 3, fracc. IX Bis, LFPIORPI)',
      detail:'Define a la Persona Políticamente Expuesta (PEP), fracción adicionada en la reforma DOF 16-07-2025: quien desempeña o ha desempeñado funciones públicas destacadas en territorio nacional o en un país extranjero.'},
    {num:'5', topic:'Autoridad competente: la Secretaría de Hacienda y Crédito Público (SHCP)', word:'HACIENDA', clue:'Secretaría que es la autoridad competente para aplicar la LFPIORPI, a través de la UIF (Art. 5)',
      detail:'Señala que la autoridad competente para aplicar esta ley es la Secretaría de Hacienda y Crédito Público (SHCP), a través de la Unidad de Inteligencia Financiera (UIF) — a diferencia del régimen bancario de la DCG 115, donde la autoridad supervisora directa es la Comisión Nacional Bancaria y de Valores (CNBV).'},
    {num:'17', topic:'Actividades Vulnerables (AV) y sus umbrales en Unidad de Medida y Actualización (UMA)', word:'VULNERABLES', clue:'Actividades enlistadas una por una, cada una con su propio umbral en UMA (Art. 17 LFPIORPI)',
      detail:'Es el artículo más extenso y más preguntado del examen en esta ley: enumera, una por una, todas las Actividades Vulnerables (AV) —por ejemplo, venta de inmuebles, de vehículos, de obras de arte, de metales preciosos, servicios de blindaje, juegos con apuesta, entre muchas otras— junto con el umbral de monto, en Unidades de Medida y Actualización (UMA), a partir del cual cada actividad genera obligaciones de identificación y, en su caso, de Aviso.'},
    {num:'18', topic:'Obligaciones del Sujeto Obligado (identificación, conservación 10 años, Enfoque Basado en Riesgo, EBR)', word:'SUJETOOBLIGADO', clue:'Quien realiza una Actividad Vulnerable y debe identificar clientes y conservar expedientes 10 años (Art. 18 LFPIORPI)',
      detail:'Enlista las obligaciones generales de quien realiza una Actividad Vulnerable, el "Sujeto Obligado": identificar a sus clientes, conservar su información y documentación por al menos 10 años, aplicar un Enfoque Basado en Riesgo (EBR) para saber a quién vigilar más de cerca, y contar con un manual de políticas de cumplimiento.'},
    {num:'20', topic:'Representante Encargado del Cumplimiento', word:'CUMPLIMIENTO', clue:'Persona designada dentro de la empresa para vigilar que se cumpla la LFPIORPI (Art. 20, Representante Encargado del ___)',
      detail:'Obliga a designar a un Representante Encargado del Cumplimiento: la persona dentro de la empresa responsable de que se cumplan las obligaciones de esta ley, de capacitar al personal y de ser el enlace con la autoridad.'},
    {num:'23', topic:'Plazo del Aviso — día 17 del mes siguiente a la operación', word:'AVISO', clue:'Reporte que debe presentarse a más tardar el día 17 del mes siguiente a la operación (Art. 23 LFPIORPI)',
      detail:'Fija el plazo para presentar el Aviso —el reporte que se envía a la autoridad cuando una operación alcanza el umbral de la actividad vulnerable correspondiente—: a más tardar el día 17 del mes siguiente a aquel en que se realizó la operación.'},
    {num:'32', topic:'Restricciones de uso de efectivo', word:'EFECTIVO', clue:'Lo que la LFPIORPI restringe como medio de pago en operaciones de alto valor, como inmuebles o vehículos (Art. 32)',
      detail:'Restringe el uso de dinero en efectivo y de metales preciosos para pagar ciertas operaciones de alto valor, como la compra de inmuebles o de vehículos, obligando a usar medios de pago que dejen rastro (transferencias, cheques, tarjetas) por encima de ciertos montos.'},
    {num:'33', topic:'Identificación de forma de pago por fedatarios públicos — umbral 8,025 UMA', word:'FEDATARIOPAGO', clue:'Umbral, en veces el valor de la UMA, a partir del cual un fedatario público debe identificar la forma de pago de un acto u operación (Art. 33)',
      detail:'Exige a los fedatarios públicos identificar la forma de pago cuando el acto u operación sea igual o superior a 8,025 veces el valor diario de la Unidad de Medida y Actualización (UMA).'},
    {num:'33 Bis', topic:'Obligación de las sociedades mercantiles de atender requerimientos sobre su Beneficiario Controlador', word:'REQUERIMIENTOCONTROLADOR', clue:'Lo que deben atender las sociedades mercantiles cuando la autoridad les pide determinar claramente a su Beneficiario Controlador (Art. 33 Bis)',
      detail:'Parte del Capítulo IV Bis "Del Beneficiario Controlador" (adicionado DOF 16-07-2025): obliga a las sociedades mercantiles a atender los requerimientos que realicen las autoridades competentes para determinar claramente a su Beneficiario Controlador.'},
    {num:'33 Ter', topic:'Registro electrónico del Beneficiario Controlador', word:'REGISTROCONTROLADOR', clue:'Sistema donde las sociedades mercantiles deben registrar la información para identificar a su Beneficiario Controlador (Art. 33 Ter)',
      detail:'Obliga a las sociedades mercantiles a registrar, en el sistema electrónico de la autoridad, la información necesaria para identificar a la persona o grupo de personas que califiquen como su Beneficiario Controlador.'},
    {num:'33 Quáter', topic:'Promoción de la identificación del Beneficiario Controlador ante entidades federativas', word:'PROMOCIONCONTROLADOR', clue:'A quiénes se promueve, ante las entidades federativas, que identifiquen a su Beneficiario Controlador igual que las sociedades mercantiles (Art. 33 Quáter)',
      detail:'Faculta a promover ante las entidades federativas que las sociedades y asociaciones civiles cumplan con la misma identificación del Beneficiario Controlador que exigen los Arts. 33 Bis y 33 Ter a las sociedades mercantiles.'},
    {num:'53', topic:'Supuestos de infracción (sin montos)', word:'SUPUESTOSINFRACCION', clue:'Artículo que enlista las conductas sancionables de la LFPIORPI, sin fijar todavía ningún monto de multa (Art. 53)',
      detail:'Enlista los supuestos de infracción administrativa de la ley —no incumplir requerimientos, no cumplir las obligaciones del Art. 18, presentar Avisos extemporáneos, omitir Avisos, incumplir la identificación del Beneficiario Controlador, o participar en actos prohibidos de uso de efectivo del Art. 32— sin fijar los montos de las multas, los cuales están en el Art. 54.'},
    {num:'54', topic:'Montos de las multas — de 200 a 65,000 UMA según la fracción del Art. 53', word:'SANCIONES', clue:'Artículo que fija, en veces el valor de la UMA, los montos de multa para cada supuesto del Art. 53 (Art. 54)',
      detail:'Fija las multas en veces el valor diario de la Unidad de Medida y Actualización (UMA): de 200 a 2,000 UMA para las fracciones I a IV del Art. 53 (por ejemplo, no atender requerimientos o no cumplir las obligaciones del Art. 18); de 2,000 a 10,000 UMA para la fracción V (Avisos con retraso mayor al permitido); y de 10,000 a 65,000 UMA, o del 10% al 100% del valor del acto u operación —lo que resulte mayor— para las fracciones VI y VII (omitir Avisos del Art. 17 o participar en operaciones prohibidas con efectivo del Art. 32).'},
    {num:'54 Bis', topic:'Suspensión temporal de operaciones mientras se corrige el incumplimiento', word:'SUSPENSIONTEMPORAL', clue:'Medida que puede ordenar la autoridad mientras un Sujeto Obligado corrige un incumplimiento, antes de multarlo (Art. 54 Bis)',
      detail:'Faculta a la Secretaría de Hacienda y Crédito Público (SHCP) a suspender temporalmente las operaciones con ciertos clientes mientras el Sujeto Obligado corrige el incumplimiento detectado.'},
    {num:'55', topic:'Reducción o condonación de la multa por regularización espontánea', word:'REGULARIZACIONESPONTANEA', clue:'Beneficio que recibe quien corrige su incumplimiento por su propia cuenta, antes de que la autoridad lo detecte (Art. 55)',
      detail:'Permite que la autoridad se abstenga de sancionar, por única ocasión, a quien regularice espontáneamente su incumplimiento antes de que la autoridad lo detecte; en regularizaciones posteriores, puede reducir hasta en un 50% el monto de la multa.'},
  ]},
  { id:'cnbv', label:'Ley CNBV', full:'Ley de la Comisión Nacional Bancaria y de Valores (CNBV)', icon:'🏛️', color:'#c99a3b', items:[
    {num:'1', topic:'Creación de la Comisión Nacional Bancaria y de Valores (CNBV)', word:'COMISION', clue:'Órgano desconcentrado de la SHCP, con autonomía técnica y facultades ejecutivas, que crea el Art. 1 de su propia ley',
      detail:'Crea a la Comisión Nacional Bancaria y de Valores (CNBV) como un órgano desconcentrado de la Secretaría de Hacienda y Crédito Público (SHCP), con autonomía técnica y facultades ejecutivas en los términos de su ley.'},
    {num:'2', topic:'Objeto de la CNBV: supervisar y regular el sistema financiero', word:'ESTABILIDADSISTEMA', clue:'Lo que, junto con el correcto funcionamiento del sistema financiero, procura la supervisión de la CNBV (Art. 2 Ley CNBV)',
      detail:'Establece el objeto de la Comisión Nacional Bancaria y de Valores (CNBV): supervisar y regular, en el ámbito de su competencia, a las entidades del sistema financiero mexicano (bancos, casas de bolsa, SOFOM, entre otras), para procurar su estabilidad y correcto funcionamiento, así como mantener y fomentar su sano y equilibrado desarrollo, en protección de los intereses del público.'},
    {num:'4, fracc. X', topic:'Certificación de auditores externos y oficiales de cumplimiento de las entidades supervisadas', word:'CERTIFICACION', clue:'Facultad de la CNBV de la que nace el examen que estás estudiando, renovable cada 5 años (Art. 4, fracc. X)',
      detail:'Otorga a la Comisión Nacional Bancaria y de Valores (CNBV) la facultad de certificar a los auditores externos independientes y demás profesionales —incluidos los oficiales de cumplimiento— que prestan servicios a las entidades y personas que supervisa, para la verificación del cumplimiento en materia de prevención, detección y reporte de los delitos de los Arts. 139, 148 Bis o 400 Bis del Código Penal Federal (CPF). Es la base legal de donde nace el propio examen de certificación que estás estudiando; la certificación debe renovarse cada 5 años.'},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function lawById(id){ return LAWS.find(l=>l.id===id); }

function go(screen, extra){ state = Object.assign({screen}, extra||{}); render(); window.scrollTo({top:0}); }

function crumbsHTML(){
  const parts = [{label:'Leyes', screen:'laws'}];
  if(state.lawId){
    const l = state.lawId==='mixed' ? {label:'Modo Revuelto'} : {label: lawById(state.lawId).label};
    parts.push({label:l.label, screen:'games', lawId:state.lawId});
  }
  if(state.gameId){
    const g = GAMES.find(g=>g.id===state.gameId);
    parts.push({label:g.name});
  }
  return '<div class="crumbs">' + parts.map((p,i)=>{
    const isLast = i===parts.length-1;
    const sep = i>0 ? '<span class="sep">›</span>' : '';
    if(isLast || !p.screen) return sep + '<span>'+esc(p.label)+'</span>';
    return sep + '<button data-nav="'+p.screen+'" data-law="'+(p.lawId||'')+'">'+esc(p.label)+'</button>';
  }).join('') + '</div>';
}

function render(){
  app.innerHTML =
    '<header class="top"><div><h1>Juegos de Repaso PLD/FT</h1><div class="tag">Prevención de Lavado de Dinero y Financiamiento al Terrorismo — práctica ley por ley</div></div></header>'
    + crumbsHTML()
    + '<div id="screen"></div>'
    + '<footer class="foot">Contenido basado en tu checklist "Artículos para Imprimir y Estudiar" — 8 grupos de leyes, '+POOL.length+' artículos en total.</footer>';
  app.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=> go(b.dataset.nav, b.dataset.law ? {lawId:b.dataset.law} : null));
  });
  const screenEl = document.getElementById('screen');
  if(state.screen==='laws') renderLaws(screenEl);
  else if(state.screen==='games') renderGames(screenEl);
  else if(state.screen==='play') renderPlay(screenEl);
}

function renderLaws(el){
  let html = '<div class="grid">';
  LAWS.forEach(l=>{
    html += '<button class="card" data-law="'+l.id+'" style="border-top:4px solid '+l.color+'">'
      + '<span class="icon">'+l.icon+'</span><h3>'+esc(l.label)+'</h3><p>'+esc(l.full)+'</p>'
      + '<span class="count">'+l.items.length+' artículo'+(l.items.length===1?'':'s')+'</span></button>';
  });
  html += '<button class="card mixed" data-law="mixed"><span class="icon">🔀</span><h3>Modo Revuelto</h3>'

  el.innerHTML = html;
  el.querySelectorAll('[data-law]').forEach(b=> b.addEventListener('click', ()=> go('games', {lawId:b.dataset.law})));

function renderGames(el){
  const lawId = state.lawId;
  const items = lawId==='mixed' ? POOL : lawById(lawId).items.map(it=>({...it, lawId}));
  let html = '<div class="grid">';

  el.querySelectorAll('[data-game]').forEach(b=> b.addEventListener('click', ()=> go('play', {lawId, gameId:b.dataset.game})));

function renderPlay(el){
  const lawId = state.lawId;
  const items = lawId==='mixed' ? POOL : lawById(lawId).items.map(it=>({...it, lawId}));
  const gameId = state.gameId;
  el.innerHTML = '<div class="panel" id="gamebox"></div>';
  const box = document.getElementById('gamebox');
  if(gameId==='sopa') playSopa(box, items);
  else if(gameId==='cruci') playCruci(box, items);
  else if(gameId==='memorama') playMemorama(box, items);
  else if(gameId==='relaciona') playRelaciona(box, items);
  else if(gameId==='vf') playVF(box, items);
  else if(gameId==='trampa') playTrampa(box, items, lawId);
  else if(gameId==='completa') playCompleta(box, items);
  else if(gameId==='trivia') playTrivia(box, items, lawId);
