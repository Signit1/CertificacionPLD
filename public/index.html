<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloque PLD · Material de estudio para Certificación PLD</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#161b22">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="menu-toggle" type="button" title="Toggle menu" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <a class="brand" href="/" aria-label="Bloque PLD, inicio">
      <img class="brand-full" src="/logo-bloque-pld.png" alt="Bloque PLD" width="163" height="40">
      <img class="brand-mark" src="/logo-bloquito.png" alt="Bloque PLD" width="40" height="40">
    </a>
    <div class="header-text">
      <h1>Material de estudio para Certificación PLD</h1>
      <p class="subtitle">Por: Cindy Jiménez</p>
    </div>
  </header>

  <main>
    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Material</h2>
        <button id="refresh-btn" type="button" title="Refresh file list">↻</button>
      </div>
      <ul id="file-list"></ul>
      <p id="empty-state" class="hidden">No HTML files found in the <code>public/html/</code> folder.</p>
    </aside>

    <section id="viewer">
      <div id="placeholder">
        <p>No files available to preview.</p>
      </div>
      <iframe id="preview" title="HTML preview" hidden></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
